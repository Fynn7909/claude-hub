[package]
name = "claude-hub"
version = "0.1.0"
description = "Dashboard für Claude Code"
edition = "2021"

[lib]
name = "claude_hub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
dirs = "6"
regex = "1"
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
