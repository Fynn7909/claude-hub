<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="app">
  <div class="shell" data-tauri-drag-region>
    <aside class="side glass" data-tauri-drag-region>
      <div class="side-head" data-tauri-drag-region>
        <button class="home" id="home" type="button" title="Alles neu laden">
          <span class="mark" aria-hidden="true"></span>
          <span class="brand">Claude Hub</span>
        </button>
      </div>
      <button class="find" id="find" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/></svg>
        <span>Suchen</span><kbd>Strg K</kbd>
      </button>
      <nav class="side-nav" id="nav"></nav>
    </aside>
    <div class="main">
      <div class="bar" data-tauri-drag-region>
        <div class="win" id="win">
          <button data-win="minimize" aria-label="Minimieren"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6"/></svg></button>
          <button data-win="toggleMaximize" aria-label="Maximieren"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2v6M2 5h6"/></svg></button>
          <button data-win="close" aria-label="Schließen"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.6 2.6l4.8 4.8M7.4 2.6L2.6 7.4"/></svg></button>
        </div>
      </div>
      <main id="view" class="view"></main>
      <footer id="idea" class="idea" aria-live="polite"></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="hub.js"></script>
</body>
</html>
